[package]
name = "portopsy"
version = "0.1.0"
edition = "2021"
description = "Explain what is occupying a TCP or UDP port on Linux"
license = "MIT"
readme = "README.md"
keywords = ["linux", "networking", "cli", "debugging", "devtools"]
